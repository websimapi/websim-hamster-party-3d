<html><head><base href="/" />
<title>Hamster Party 3D!</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }
  
  #startScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, #FFB6C1, #FFA07A);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .title {
    font-size: 4em;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 30px;
  }

  #startButton {
    padding: 15px 40px;
    font-size: 1.5em;
    background: #FF69B4;
    border: none;
    border-radius: 25px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  #startButton:hover {
    transform: scale(1.1);
  }

  #customizePanel {
    position: absolute;
    right: 20px;
    top: 20px;
    background: rgba(255,255,255,0.9);
    padding: 20px;
    border-radius: 10px;
    display: none;
  }

  .color-picker {
    margin: 10px 0;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="startScreen">
  <h1 class="title">Hamster Party 3D!</h1>
  <button id="startButton">Start Game!</button>
</div>

<div id="customizePanel">
  <h3>Customize Your Hamster</h3>
  <div class="color-picker">
    <label>Fur Color:</label>
    <input type="color" id="furColor" value="#B87A3D">
  </div>
  <button id="spawnHamster">Add Hamster!</button>
</div>

<script type="module">
  let scene, camera, renderer, hamsters = [];
  let bgMusic = new Audio('Pixelated Echoes of the Past - Track 2 - Sonauto.wav');
  bgMusic.loop = true;

  function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Add lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(0, 10, 5);
    scene.add(directionalLight);

    // Create floor
    const floorGeometry = new THREE.PlaneGeometry(20, 20);
    const floorMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x90EE90,
      roughness: 0.8
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);

    animate();
  }

  function createHamster(color = 0xB87A3D) {
    const hamsterGroup = new THREE.Group();
    
    // Body
    const bodyGeometry = new THREE.SphereGeometry(0.5, 32, 32);
    const bodyMaterial = new THREE.MeshStandardMaterial({ color: color });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    hamsterGroup.add(body);

    // Head
    const headGeometry = new THREE.SphereGeometry(0.3, 32, 32);
    const head = new THREE.Mesh(headGeometry, bodyMaterial);
    head.position.set(0.4, 0.2, 0);
    hamsterGroup.add(head);

    // Eyes
    const eyeGeometry = new THREE.SphereGeometry(0.05, 16, 16);
    const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
    
    const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    leftEye.position.set(0.5, 0.3, 0.15);
    hamsterGroup.add(leftEye);

    const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    rightEye.position.set(0.5, 0.3, -0.15);
    hamsterGroup.add(rightEye);

    // Random position
    hamsterGroup.position.set(
      (Math.random() - 0.5) * 10,
      0.5,
      (Math.random() - 0.5) * 10
    );

    scene.add(hamsterGroup);
    hamsters.push({
      mesh: hamsterGroup,
      velocity: new THREE.Vector3(0, 0, 0),
      direction: Math.random() * Math.PI * 2
    });
  }

  function animate() {
    requestAnimationFrame(animate);

    // Animate hamsters
    hamsters.forEach(hamster => {
      // Random movement
      hamster.direction += (Math.random() - 0.5) * 0.1;
      hamster.mesh.rotation.y = hamster.direction;
      
      const speed = 0.03;
      hamster.mesh.position.x += Math.cos(hamster.direction) * speed;
      hamster.mesh.position.z += Math.sin(hamster.direction) * speed;

      // Keep hamsters within bounds
      if (Math.abs(hamster.mesh.position.x) > 9) {
        hamster.direction = Math.PI - hamster.direction;
      }
      if (Math.abs(hamster.mesh.position.z) > 9) {
        hamster.direction = -hamster.direction;
      }
    });

    renderer.render(scene, camera);
  }

  // Event Listeners
  document.getElementById('startButton').addEventListener('click', () => {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('customizePanel').style.display = 'block';
    bgMusic.play();
    init();
    
    // Add some initial hamsters
    for (let i = 0; i < 3; i++) {
      createHamster();
    }
  });

  document.getElementById('spawnHamster').addEventListener('click', () => {
    const color = new THREE.Color(document.getElementById('furColor').value);
    createHamster(color);
  });

  window.addEventListener('resize', () => {
    if (camera && renderer) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });
</script>

</body>
</html>
